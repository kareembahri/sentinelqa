# SentinelQA local stack.
# Phase 2: PostgreSQL + API. Later phases add the worker, ZAP, Juice Shop and the dashboard.
#
# All values come from the .env file next to this one (copy .env.example to .env).
# The ":?" syntax makes Compose stop with an error if a required value is missing,
# instead of silently starting with an empty password.

name: sentinelqa

services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose. The database is reachable only by other containers,
    # never from your network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:-}
      ALLOWED_PRIVATE_LAB_HOSTS: ${ALLOWED_PRIVATE_LAB_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
    # 127.0.0.1 means only this computer can open the API, not other devices on your Wi-Fi.
    ports:
      - "127.0.0.1:8000:8000"
    # Your backend folder is mounted into the container, so files that Alembic
    # generates appear in your project, and code changes apply on restart.
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  pgdata:
